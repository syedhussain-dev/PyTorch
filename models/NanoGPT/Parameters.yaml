NanoGPT:
  embed_dim: 768
  heads: 12
  mlp_dim: 3072
  mlp_dropout: 0.0
  attn_dropout: 0.0
  num_encoder_layers: 12
  context_length: 1024
  gradient_checkpointing: false

  training:
    batch_size: 8
    epochs: 5
    optimiser: AdamW
    loss_fn: CrossEntropyLoss
    scheduler: CosineAnnealing
    accum_steps: 8
    model_name: NanoGPT
    target_dir: saved_models
    device: cuda
    loss_curves: True
    
